game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false
    coalesce_interval_ms: 1

traffic_signal_collector:
  ros__parameters:
    joy_topic: /traffic_signal_collector/joy
    motor_topic: /xycar_motor
    camera_topic: /image_raw
    preview_topic: /traffic_signal_collector/preview
    steering_contract: normalized_percent_v1
    steering_axis: 0
    lt_axis: 4
    rt_axis: 5
    trigger_axis_mode: negative
    invert_steering: true
    max_angle: 100.0
    max_reverse_speed: 5.0
    max_forward_speed: 5.0
    publish_rate_hz: 20.0
    joy_timeout_sec: 0.25
    camera_timeout_sec: 0.50
    graph_check_period_sec: 0.5
    neutral_trigger_threshold: 0.05
    stop_publish_count: 5
    allowed_motor_relay_nodes: ['/ros_bridge']
    red_button: 2
    yellow_button: 3
    straight_green_button: 1
    left_green_button: 0
    recording_root_dir: /home/xytron/xycar_data/traffic_signal_images
    recording_jpeg_quality: 95
    recording_queue_size: 128
    recording_min_free_space_mb: 1024
    preview_enabled: false
