game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    sticky_buttons: false
    coalesce_interval_ms: 1

gamepad_teleop:
  ros__parameters:
    joy_topic: /joy
    motor_topic: /xycar_motor
    camera_topic: /image_raw

    # Remote Gamepad mapping observed through joy/game_controller_node.
    # The vehicle Remote Gamepad reports released..pressed triggers as 0..-1.
    steering_axis: 0
    lt_axis: 4
    rt_axis: 5
    trigger_axis_mode: negative
    invert_steering: true

    # angle = -steering * max_angle (Xycar motor driver compensation)
    # speed = RT * max_forward_speed - LT * max_reverse_speed
    max_angle: 100.0
    max_reverse_speed: 5.0
    max_forward_speed: 7.0

    publish_rate_hz: 20.0
    joy_timeout_sec: 0.25
    graph_check_period_sec: 0.5
    neutral_trigger_threshold: 0.05
    stop_publish_count: 5
    # Accept the local ROS 1 bridge only when its unnamed DDS publisher and
    # subscriber share one participant GID.
    allowed_motor_relay_nodes: ['/ros_bridge']

    # Hold A while stopped to wait; recording begins only after the node
    # actually publishes a positive speed. B saves without stopping the car.
    record_start_button: 0
    record_stop_button: 1

    # Camera-only behavior-cloning samples use the same root and CSV contract
    # as terminal teleop. The newest 15 frames are held back while recording.
    recording_root_dir: /home/xytron/xycar_data/teleop
    emergency_discard_frames: 15
    recording_png_compression: 3
    recording_queue_size: 128
    recording_min_free_space_mb: 1024
