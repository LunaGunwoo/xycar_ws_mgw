# Camera frames are the primary AI samples. LiDAR is optional metadata and
# never gates driving or image collection.
topics:
  camera_topic: /image_raw
  lidar_topic: /scan
  motor_topic: /xycar_motor

control:
  # Commands are Float32MultiArray([angle, speed]).
  publish_rate_hz: 20.0
  key_timeout_sec: 0.25
  graph_check_period_sec: 0.5
  stop_publish_count: 5
  # W/S set speed immediately; uppercase W is Shift+W boost. A/D adjust only
  # steering. At a typical 30 Hz terminal key-repeat rate, 10 A/D events
  # reach full lock in about 0.3 seconds after repeat begins.
  min_angle: -100.0
  max_angle: 100.0
  angle_step: 10.0
  forward_speed: 8.0
  forward_boost_multiplier: 1.5
  reverse_speed: -8.0

sensors:
  # The camera is mandatory for motion. LiDAR remains optional.
  camera_timeout_sec: 0.25
  # Reuse an existing healthy /image_raw source. If none exists, start only
  # the headless xycar_cam.launch.py and wait for a decodable frame.
  camera_auto_start: true
  camera_discovery_timeout_sec: 1.0
  camera_start_timeout_sec: 10.0
  camera_shutdown_timeout_sec: 5.0
  lidar_timeout_sec: 0.30
  max_lidar_skew_sec: 0.20

recording:
  root_dir: /home/xytron/xycar_data/teleop
  # OpenCV PNG compression range: 0 (fast/larger) .. 9 (slow/smaller).
  png_compression: 3
  queue_size: 128
  min_free_space_mb: 1024
