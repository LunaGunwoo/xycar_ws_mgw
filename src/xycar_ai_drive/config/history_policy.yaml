game_controller_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 30.0
    sticky_buttons: false
    coalesce_interval_ms: 1

history_policy:
  ros__parameters:
    camera_topic: /image_raw
    joy_topic: /joy
    motor_topic: /xycar_motor_command
    executed_topic: /xycar_motor_executed
    ready_topic: /xycar_motor_native/ready
    prediction_topic: /history_policy/prediction
    enabled_topic: /history_policy/enabled
    a_button_index: 0
    allow_motion: true
    force_speed_zero: false
    require_schema4: true
    joy_timeout_sec: 0.25
    inference_timeout_sec: 0.25
    execution_timeout_sec: 0.25
    watchdog_rate_hz: 30.0
    graph_check_period_sec: 0.25
    metrics_period_sec: 2.0
    stop_publish_count: 5
    inference_backend: local
    inference_device: cpu
    inference_socket_path: /run/user/1000/xycar-ai/policy.sock
    inference_rpc_timeout_sec: 0.20
    torch_num_threads: 8
    warmup_count: 3
