schema_version: 1
policy_kind: signal

model:
  backbone: mobilenetv3_small_100.lamb_in1k
  pretrained: true
  hidden_size: 256
  input_height: 160
  input_width: 320

data:
  root: datasets/competition_manual
  split_manifest: config/competition_signal_split.yaml
  sequence_length: 12
  frame_stride: 2
  window_step: 4
  num_workers: 4
  minimum_signal_sessions_per_state: 20
  minimum_negative_sessions: 10

training:
  seed: 20260815
  device: cuda
  deterministic: true
  amp: true
  batch_size: 8
  epochs: 40
  early_stopping_patience: 7
  learning_rate: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0

output:
  root: artifacts/runs/traffic_signal_policy
  run_name: signal_mobilenetv3_gru_seed20260815
