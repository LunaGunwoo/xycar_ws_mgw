[project]
name = "xycar-ai"
version = "0.1.0"
description = "Reproducible training workspace for Xycar real-car models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python>=4.10,<5",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "timm>=1.0.28,<1.1",
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "tqdm>=4.67,<5",
]

[project.scripts]
xycar-competition-data = "xycar_ai.competition_data:main"
xycar-export-policy = "xycar_ai.export_front_cam_policy:main"
xycar-export-shortcut = "xycar_ai.export_competition_policy:shortcut_main"
xycar-export-signal = "xycar_ai.export_competition_policy:signal_main"
xycar-build-competition-bundle = "xycar_ai.export_competition_policy:bundle_main"
xycar-compare-policy = "xycar_ai.compare_front_cam_policy:main"
xycar-train-shortcut = "xycar_ai.train_competition_policy:shortcut_main"
xycar-train-signal = "xycar_ai.train_competition_policy:signal_main"
xycar-train = "xycar_ai.train_front_cam_policy:main"
xycar-warp-tuner = "xycar_ai.front_cam_policy_warp_tuner:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xycar_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = true
